<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Recitation Checker</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .ayah-box {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .arabic {
            font-family: 'Amiri', serif;
            font-size: 2.2rem;
            color: #111;
            line-height: 2.2;
            text-align: right;
        }
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #219653;
        }
        #status {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
        }
        .result-correct {
            color: #27ae60;
        }
        .result-wrong {
            color: #c0392b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="surah-title">اختبار التلاوة (Recitation Practice)</h1>
        
        <div class="ayah-box">
            <p>اقرأ الآية التالية بصوتك:</p>
            <div id="target-arabic" class="arabic">جاري التحميل...</div>
        </div>

        <div class="controls">
            <button id="mic-btn" onclick="startListening()">اضغط وابدأ التلاوة (Start Reciting)</button>
        </div>

        <div id="status"></div>
        <div id="user-said" style="text-align: center; color: #666; margin-top: 10px;"></div>
    </div>

    <script>
        let targetAyahText = "";

        async function loadFirstAyah() {
            try {
                // Fetching Surah Al-Fatihah, Ayah 1 (Bismillah)
                const response = await window.fetch('https://api.alquran.cloud/v1/ayah/1/editions/quran-uthmani');
                const data = await response.json();
                if (data.code === 200) {
                    targetAyahText = data.data[0].text.trim();
                    // Clean text from standard decorative symbols for easier matching
                    document.getElementById('target-arabic').innerText = targetAyahText;
                }
            } catch (error) {
                console.error(error);
            }
        }

        function cleanText(text) {
            // Remove tashkeel (diacritics) and standard punctuation for flexible voice matching
            return text.replace(/[\u0617-\u061A\u064B-\u0652]/g, "").replace(/[^\u0621-\u064A\s]/g, "").trim();
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("متصفحك لا يدعم خاصية التعرف على الصوت. استخدم متصفح Google Chrome.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA'; // Set language to Arabic
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            const statusEl = document.getElementById('status');
            const userSaidEl = document.getElementById('user-said');
            
            statusEl.innerText = "جاري الاستماع... استمر في القراءة 🎤";
            statusEl.className = "";
            userSaidEl.innerText = "";

            recognition.start();

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                userSaidEl.innerText = `ما سمعناه منك: "${speechResult}"`;

                // Compare cleaned versions of the target verse and what the user spoke
                const cleanTarget = cleanText(targetAyahText);
                const cleanSpoken = cleanText(speechResult);

                // Check similarity or containment
                if (cleanSpoken.includes(cleanTarget) || cleanTarget.includes(cleanSpoken)) {
                    statusEl.innerText = "احسنت! تلاوة صحيحة 🟩";
                    statusEl.className = "result-correct";
                } else {
                    statusEl.innerText = "خطأ، حاول مرة أخرى 🟥";
                    statusEl.className = "result-wrong";
                }
            };

            recognition.onerror = function(event) {
                statusEl.innerText = "حدث خطأ في التقاط الصوت. حاول مرة أخرى.";
                statusEl.className = "result-wrong";
            };
        }

        loadFirstAyah();
    </script>

</body>
</html>
