<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Reader with Voice Recorder</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .ayah-card {
            background: #fafbfc;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 2.3rem;
            color: #111;
            line-height: 2.5;
            text-align: right;
            margin-bottom: 15px;
        }
        .translation-text {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 15px;
            text-align: left;
            direction: ltr;
        }
        .audio-section {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed #ddd;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .recorder-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            padding: 8px 15px;
            font-size: 0.95rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }
        .btn-record { background-color: #e74c3c; }
        .btn-record:hover { background-color: #c0392b; }
        .btn-stop { background-color: #7f8c8d; }
        .btn-stop:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        audio {
            width: 100%;
            height: 35px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="surah-title">جاري تحميل القرآن...</h1>
        <div id="verses-container"></div>
    </div>

    <script>
        async function loadSurahWithRecorder() {
            try {
                // Fetching Surah 1 with full Uthmanic text, translation, and professional audio
                const response = await fetch('https://api.alquran.cloud/v1/surah/1/editions/quran-uthmani,en.sahih,ar.alafasy');
                const data = await response.json();

                if (data.code === 200) {
                    const arabicEdition = data.data[0];
                    const translationEdition = data.data[1];
                    const audioEdition = data.data[2];

                    document.getElementById('surah-title').innerText = `${arabicEdition.englishName} (${arabicEdition.name})`;

                    const container = document.getElementById('verses-container');
                    container.innerHTML = '';

                    arabicEdition.ayahs.forEach((ayah, index) => {
                        const translationText = translationEdition.ayahs[index].text;
                        const proAudioUrl = audioEdition.ayahs[index].audio;
                        const verseId = ayah.numberInSurah;

                        const card = document.createElement('div');
                        card.className = 'ayah-card';
                        card.innerHTML = `
                            <div class="arabic-text">${ayah.text} ﴿${verseId}﴾</div>
                            <div class="translation-text">${verseId}. ${translationText}</div>
                            
                            <div class="audio-section">
                                <div><strong>القارئ المحترف (Listen):</strong></div>
                                <audio controls src="${proAudioUrl}"></audio>
                                
                                <div><strong>تسجيل صوتك (Record Yourself):</strong></div>
                                <div class="recorder-controls">
                                    <button class="btn-record" onclick="startRecording(${verseId})">🔴 تسجيل</button>
                                    <button class="btn-stop" id="stop-btn-${verseId}" onclick="stopRecording(${verseId})" disabled>⏹ إيقاف</button>
                                </div>
                                <audio id="playback-${verseId}" controls style="display:none; margin-top:5px;"></audio>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('surah-title').innerText = 'حدث خطأ أثناء تحميل البيانات.';
            }
        }

        let mediaRecorder;
        let audioChunks = [];

        async function startRecording(verseId) {
            audioChunks = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    
                    const playbackElement = document.getElementById(`playback-${verseId}`);
                    playbackElement.src = audioUrl;
                    playbackElement.style.display = 'block';
                };

                mediaRecorder.start();
                
                // Toggle button states
                document.getElementById(`stop-btn-${verseId}`).disabled = false;
            } catch (err) {
                alert("يرجى السماح للبراوزر بالوصول إلى الميكروفون.");
                console.error(err);
            }
        }

        function stopRecording(verseId) {
            if (mediaRecorder) {
                mediaRecorder.stop();
                document.getElementById(`stop-btn-${verseId}`).disabled = true;
            }
        }

        loadSurahWithRecorder();
    </script>

</body>
</html>
