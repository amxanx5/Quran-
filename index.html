<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Reader - Recitation & Audio</title>
    <!-- Importing Amiri font for perfect Uthmanic Arabic rendering -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .ayah-card {
            background: #fafbfc;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 2.3rem;
            color: #111;
            line-height: 2.5;
            text-align: right;
            margin-bottom: 15px;
        }
        .translation-text {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 15px;
            text-align: left;
            direction: ltr;
        }
        audio {
            width: 100%;
            height: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="surah-title">جاري تحميل القرآن...</h1>
        <div id="verses-container"></div>
    </div>

    <script>
        async function loadSurahWithAudio() {
            try {
                // Fetching Surah 1 (Al-Fatihah) with Uthmanic text (has all Kasra/Damma), 
                // English translation, and Mishary Alafasy audio
                const response = await fetch('https://api.alquran.cloud/v1/surah/1/editions/quran-uthmani,en.sahih,ar.alafasy');
                const data = await response.json();

                if (data.code === 200) {
                    const arabicEdition = data.data[0];
                    const translationEdition = data.data[1];
                    const audioEdition = data.data[2];

                    // Set Title
                    document.getElementById('surah-title').innerText = `${arabicEdition.englishName} (${arabicEdition.name})`;

                    const container = document.getElementById('verses-container');
                    container.innerHTML = '';

                    // Loop through each ayah and combine text, translation, and audio
                    arabicEdition.ayahs.forEach((ayah, index) => {
                        const translationText = translationEdition.ayahs[index].text;
                        const audioUrl = audioEdition.ayahs[index].audio;

                        const card = document.createElement('div');
                        card.className = 'ayah-card';
                        card.innerHTML = `
                            <div class="arabic-text">${ayah.text} ﴿${ayah.numberInSurah}﴾</div>
                            <div class="translation-text">${ayah.numberInSurah}. ${translationText}</div>
                            <audio controls>
                                <source src="${audioUrl}" type="audio/mpeg">
                                متصفحك لا يدعم مشغل الصوتي
                            </audio>
                        `;
                        container.appendChild(card);
                    });
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('surah-title').innerText = 'حدث خطأ أثناء تحميل البيانات.';
            }
        }

        loadSurahWithAudio();
    </script>

</body>
</html>
